name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ENABLE_MSW: "false"
      VITE_KAKAO_REDIRECT_URI: ${{ vars.VITE_KAKAO_REDIRECT_URI }}
      VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
      VITE_KAKAO_CLIENT_ID: ${{ vars.VITE_KAKAO_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate production environment
        shell: bash
        run: |
          if [[ "$VITE_API_BASE_URL" != "https://backend-jdau.onrender.com" ]]; then
            echo "VITE_API_BASE_URL must be https://backend-jdau.onrender.com."
            exit 1
          fi
          if [[ "$VITE_ENABLE_MSW" != "false" ]]; then
            echo "VITE_ENABLE_MSW must be false."
            exit 1
          fi
          if [[ "$VITE_KAKAO_REDIRECT_URI" != "https://ecc2team.github.io/frontend/oauth/kakao/callback" ]]; then
            echo "VITE_KAKAO_REDIRECT_URI is not the production callback URL."
            exit 1
          fi
          if [[ "$VITE_GOOGLE_REDIRECT_URI" != "https://ecc2team.github.io/frontend/oauth/google/callback" ]]; then
            echo "VITE_GOOGLE_REDIRECT_URI is not the production callback URL."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
